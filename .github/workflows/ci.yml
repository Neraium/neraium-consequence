name: Package validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: ruff check . && ruff format --check . && mypy
      - run: python -m compileall -q neraium_consequence && python -m build
      - run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c 'import json; from neraium_consequence import quantify_consequence; assert quantify_consequence([], profile_key="water_gpm")["status"] == "not_quantifiable"; json.dumps(quantify_consequence([], profile_key="water_gpm"), allow_nan=False)'
